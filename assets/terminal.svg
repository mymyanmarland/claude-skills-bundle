<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <rect width="860" height="300" rx="18" fill="#0d1117"/>
  <circle cx="34" cy="30" r="8" fill="#ff5f57"/>
  <circle cx="60" cy="30" r="8" fill="#febc2e"/>
  <circle cx="86" cy="30" r="8" fill="#28c840"/>
  <text x="120" y="36" font-family="monospace" font-size="16" fill="#8b949e">skills — get one in 3 clicks</text>
  <g font-family="monospace" font-size="20">
    <text x="30" y="90" fill="#ffa751" opacity="0">$ cd skills/creative-fiction/story-plot-fixer
      <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="30" y="130" fill="#e6edf3" opacity="0">$ ls
      <animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="30" y="165" fill="#8b949e" opacity="0">SKILL.md &#160; story-plot-fixer.skill
      <animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="30" y="210" fill="#e6edf3" opacity="0">$ # upload story-plot-fixer.skill to claude.ai
      <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="30" y="255" fill="#7ee787" opacity="0">&#10003; Skill ready — type / and pick story-plot-fixer
      <animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.4s" fill="freeze"/>
    </text>
  </g>
  <rect x="30" y="272" width="200" height="6" rx="3" fill="#30363d"/>
  <rect x="30" y="272" width="200" height="6" rx="3" fill="#7ee787">
    <animate attributeName="width" values="20;200;20" begin="3.6s" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
