    <path d="M-150,338 Q-75,316 0,338 T150,338 T300,338 T450,338 T600,338 T750,338 T900,338 T1050,338 T1200,338 T1350,338 L1350,380 L-150,380 Z" fill="#ffffff" opacity="0.14"/>
