<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1055"><animate attributeName="stop-color" values="#2b1055;#4a1d8f;#2b1055" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="55%" stop-color="#7597de"><animate attributeName="stop-color" values="#7597de;#d97757;#7597de" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#d97757"><animate attributeName="stop-color" values="#d97757;#2b1055;#d97757" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe259"/><stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle cx="90" cy="70" r="9" opacity="0.35"><animate attributeName="cy" values="70;54;70" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="90" r="12" opacity="0.3"><animate attributeName="cy" values="90;106;90" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="300" r="7" opacity="0.4"><animate attributeName="cy" values="300;286;300" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="320" r="8" opacity="0.3"><animate attributeName="cy" values="320;306;320" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="52" r="5" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="120" r="4" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="150" r="4" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <rect x="330" y="48" width="24" height="24" rx="6" opacity="0.3" transform="rotate(20 342 60)"><animateTransform attributeName="transform" type="rotate" values="20 342 60;55 342 60;20 342 60" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="830" y="290" width="20" height="20" rx="5" opacity="0.3" transform="rotate(-15 840 300)"><animateTransform attributeName="transform" type="rotate" values="-15 840 300;15 840 300;-15 840 300" dur="6s" repeatCount="indefinite"/></rect>
  </g>
  <text x="600" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="bold" fill="#ffffff">Claude Skills Bundle</text>
  <text x="600" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="url(#gold)">2,015 skills &#183; 33 categories &#183; 1 click to download</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">
    <rect x="270" y="232" width="180" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
    <rect x="270" y="232" width="180" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/></rect>
    <text x="360" y="260" fill="#ffffff">2,015 SKILLS</text>
    <rect x="470" y="232" width="200" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
    <rect x="470" y="232" width="200" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="2.8s" repeatCount="indefinite"/></rect>
    <text x="570" y="260" fill="#ffffff">33 CATEGORIES</text>
    <rect x="690" y="232" width="240" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
    <rect x="690" y="232" width="240" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></rect>
    <text x="810" y="260" fill="#ffffff">SKILL.md + .skill</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-300 0;0 0" dur="9s" repeatCount="indefinite"/>
    <path d="M0,318 Q75,292 150,318 T300,318 T450,318 T600,318 T750,318 T900,318 T1050,318 T1200,318 T1350,318 T1500,318 L1500,380 L0,380 Z" fill="#ffffff" opacity="0.10"/>
  </g>
  <g>
